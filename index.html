<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07130f">
  <meta name="description" content="Organize jogadores, sorteie times e controle a sua pelada de forma simples.">
  <title>Minha Pelada — gestão do dia de jogo</title>
  <style>
    :root{--bg:#07130f;--surface:#0d2119;--surface-2:#122b20;--line:#234436;--text:#f1f7f3;--muted:#9bb3a6;--brand:#a8f26d;--brand-2:#6edc91;--warning:#ffd166;--danger:#ff8f8f;--shadow:0 18px 60px #0004}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 85% 0,#183d29 0,transparent 32rem),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{border:0;cursor:pointer}.shell{max-width:1120px;margin:auto;padding:24px 20px 56px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #ffffff12;padding:8px 0 24px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--brand);color:#102015;font-size:22px;box-shadow:0 8px 24px #a8f26d2b}.brand h1{font-size:20px;line-height:1;margin:0;letter-spacing:-.03em}.eyebrow{display:block;margin-top:5px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.14em}.top-actions{display:flex;gap:8px}.icon-button{width:42px;height:42px;border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--text);font-size:18px}.intro{display:flex;justify-content:space-between;align-items:end;gap:20px;padding:35px 0 24px}.intro h2{margin:0;font-size:clamp(26px,5vw,42px);letter-spacing:-.055em;line-height:1.05}.intro p{max-width:560px;color:var(--muted);margin:10px 0 0}.badge{display:inline-flex;align-items:center;gap:7px;background:#a8f26d18;color:var(--brand);border:1px solid #a8f26d35;padding:7px 11px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap}.badge:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px #a8f26d1c}.nav{display:flex;gap:7px;overflow-x:auto;padding:5px 0 17px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{color:var(--muted);background:transparent;border:1px solid transparent;padding:9px 13px;border-radius:10px;white-space:nowrap}.nav button:hover{color:var(--text);background:#ffffff08}.nav button.active{color:#112018;background:var(--brand);font-weight:800;box-shadow:0 6px 18px #a8f26d24}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stat{padding:18px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,var(--surface-2),var(--surface));box-shadow:var(--shadow)}.stat small{display:block;color:var(--muted);font-weight:700}.stat strong{display:block;color:var(--brand);font-size:29px;letter-spacing:-.06em;line-height:1.1;margin-top:5px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}.panel{border:1px solid var(--line);border-radius:18px;background:#0d2119e8;padding:20px;margin:0 0 16px;box-shadow:var(--shadow)}.panel-head{display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:15px}.panel h2{font-size:18px;margin:0;letter-spacing:-.025em}.panel h3{font-size:14px;margin:22px 0 10px}.muted{color:var(--muted)}.hint{margin:7px 0;color:var(--muted);font-size:13px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.field{display:grid;gap:6px;color:var(--muted);font-size:12px;font-weight:700}.field input,.field select,.input{width:100%;min-width:0;color:var(--text);background:#081811;border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}.field input:focus,.field select:focus,.input:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:17px}.btn{padding:11px 15px;border-radius:10px;border:1px solid var(--line);background:#ffffff08;color:var(--text);font-weight:750}.btn:hover{background:#ffffff12}.btn.primary{background:var(--brand);border-color:var(--brand);color:#112018}.btn.secondary{color:var(--brand);border-color:#a8f26d44}.btn.danger{color:var(--danger)}.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}.team-card{padding:13px;border:1px solid var(--line);border-radius:15px;background:#091a13}.team-title{display:flex;align-items:center;gap:8px;font-weight:800}.team-color{width:11px;height:11px;border:2px solid #fff;border-radius:50%;display:inline-block}.pitch{position:relative;aspect-ratio:.72;margin-top:11px;touch-action:none;cursor:crosshair;border:1px solid #b6e5ae99;border-radius:7px;overflow:hidden;background:repeating-linear-gradient(0deg,#236440 0 12.5%,#2b714a 12.5% 25%)}.pitch:before{content:"";position:absolute;top:50%;left:0;width:100%;border-top:1px solid #b6e5ae99}.pitch:after{content:"";position:absolute;top:39%;left:35%;width:30%;aspect-ratio:1;border:1px solid #b6e5ae99;border-radius:50%}.player{position:absolute;z-index:1;width:34%;transform:translate(-50%,-50%);text-align:center;font-size:10px;cursor:grab;touch-action:none;user-select:none}.player.dragging{cursor:grabbing;z-index:10;filter:drop-shadow(0 6px 7px #0008);transform:translate(-50%,-50%) scale(1.08)}.dot{display:block;width:25px;height:25px;margin:auto;border:1px solid #fff;border-radius:50%;line-height:23px;color:#102015;font-style:normal;font-weight:900}.player b{display:block;overflow:hidden;padding:2px 3px;border-radius:4px;background:#0b2116e6;text-overflow:ellipsis;white-space:nowrap}.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #ffffff0d}.item:last-child{border-bottom:0}.item>span{flex:1;min-width:0}.item small{color:var(--muted)}.check{width:18px;height:18px;accent-color:var(--brand)}.stepper{display:flex;align-items:center;gap:10px}.stepper button{width:30px;height:30px;border-radius:8px;background:#ffffff0e;color:var(--text);font-size:18px}.empty{text-align:center;padding:27px 12px;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:15px;margin-bottom:5px}.summary{display:grid;gap:9px}.summary-line{display:flex;justify-content:space-between;gap:12px;color:var(--muted)}.summary-line strong{color:var(--text)}.notice{padding:12px 13px;border-radius:11px;background:#ffd16614;border:1px solid #ffd1663a;color:#ffe2a0;font-size:13px}.file-label{display:block}.file-label input{margin-top:7px}.footer{margin-top:26px;text-align:center;color:#688276;font-size:12px}
    @media(max-width:760px){.shell{padding:14px 14px 40px}.topbar{padding-bottom:16px}.intro{display:block;padding:27px 0 18px}.intro .badge{margin-top:17px}.layout{display:block}.stats{gap:8px}.stat{padding:13px 12px}.stat strong{font-size:25px}.panel{padding:16px;border-radius:15px}.teams{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.team-card{padding:9px}.team-title{font-size:13px}.pitch{font-size:9px}.top-actions .btn{display:none}}
    @media(max-width:390px){.teams{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:span 2}.brand h1{font-size:18px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true">⚽</div><div><h1 id="brand">Minha Pelada</h1><span class="eyebrow">GESTÃO ESPORTIVA · DIA DE JOGO</span></div></div><div class="top-actions"><button class="btn secondary" onclick="setTab('Configurações')">⚙ Configurações</button><button class="icon-button" aria-label="Abrir configurações" onclick="setTab('Configurações')">⚙</button></div></header>
    <section class="intro"><div><h2 id="page-title">A sua pelada,<br><span style="color:var(--brand)">mais organizada.</span></h2><p>Monte o plantel, confirme presenças e sorteie equipes equilibradas em poucos passos.</p></div><span class="badge">Tudo salvo neste dispositivo</span></section>
    <nav id="nav" class="nav" aria-label="Navegação principal"></nav>
    <div id="app"></div>
    <footer class="footer">Minha Pelada · seus dados ficam apenas neste navegador</footer>
  </main>
<script>
const defaults={name:'Minha Pelada',n:5,g:1,t:3,fee:67,players:[],teams:[],history:[],tactical:{}};
let s;try{s={...defaults,...JSON.parse(localStorage.getItem('pelada-v1')||'{}')}}catch{s=structuredClone(defaults)}
let tab='Times';
const $=id=>document.getElementById(id);
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem('pelada-v1',JSON.stringify(s))}catch{alert('Não foi possível salvar. Exporte um backup.')}render()};
const tabs=['Times','Plantel','Artilharia','Financeiro','Churrasco','Configurações'];
const colors=['#fff','#94a3b8','#f87171','#60a5fa','#facc15','#c084fc','#fb923c','#2dd4bf'];
const names=['Branco','Preto','Vermelho','Azul','Amarelo','Roxo','Laranja','Verde'];
const opt=(min,max,v)=>Array.from({length:max-min+1},(_,i)=>'<option value="'+(i+min)+'" '+(i+min===v?'selected':'')+'>'+(i+min)+'</option>').join('');
const confirmed=()=>s.players.filter(p=>p.ok);
function config(k,v){s[k]=Number(v);s.teams=[];save()}
function setTab(t){tab=t;render();window.scrollTo({top:0,behavior:'smooth'})}
function add(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')).trim();if(!name)return;s.players.push({id:crypto.randomUUID(),name,pos:f.get('pos'),skill:Number(f.get('skill')),ok:true,gols:0,pago:false,bbq:false});save()}
function change(id,k,v){let p=s.players.find(p=>p.id===id);if(p){p[k]=v;if(['ok','pos','skill'].includes(k))s.teams=[];save()}}
function del(id){if(confirm('Excluir este jogador e os seus registos?')){s.players=s.players.filter(p=>p.id!==id);s.teams=[];save()}}
function draw(){let a=Array.from({length:s.t},()=>[]),pool=confirmed();for(let [pos,cap] of [['Goleiro',s.g],['Linha',s.n]]){let group=pool.filter(p=>p.pos===pos).map(p=>({p,r:Math.random()})).sort((a,b)=>b.p.skill-a.p.skill||a.r-b.r).map(x=>x.p);for(let p of group){let choices=a.map((team,i)=>({team,i})).filter(x=>x.team.filter(q=>q.pos===pos).length<cap);if(!choices.length)break;choices.sort((x,y)=>x.team.reduce((z,q)=>z+q.skill,0)-y.team.reduce((z,q)=>z+q.skill,0)||x.team.length-y.team.length);choices[0].team.push(p)}}s.teams=a.map(t=>t.map(p=>p.id));s.tactical={};save()}
function share(){let text=s.teams.map((t,i)=>'Time '+names[i]+': '+t.map(id=>s.players.find(p=>p.id===id)?.name).join(', ')).join('\n');if(navigator.share)navigator.share({title:'Minha Pelada',text}).catch(()=>{});else window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener')}
function pitch(i){let team=(s.teams[i]||[]).map(id=>s.players.find(p=>p.id===id)).filter(Boolean),html='';for(let j=0;j<s.n+s.g;j++){let keeper=s.g&&j===0,k=j-s.g,cols=Math.min(3,s.n),rows=Math.ceil(s.n/cols),x=keeper?50:(k%cols+.5)*100/cols,y=keeper?89:rows===1?45:72-Math.floor(k/cols)*60/(rows-1),p=keeper?team.find(p=>p.pos==='Goleiro'):team.filter(p=>p.pos==='Linha')[k],saved=p&&s.tactical[p.id],px=saved?.x??x,py=saved?.y??y;html+=p?'<div class="player" onpointerdown="startDrag(event,\''+p.id+'\')" style="left:'+px+'%;top:'+py+'%"><i class="dot" style="background:'+colors[i]+'">'+(keeper?'G':k+1)+'</i><b>'+esc(p.name)+'</b></div>':'<div class="player" style="left:'+x+'%;top:'+y+'%"><i class="dot" style="background:'+colors[i]+'">'+(keeper?'G':k+1)+'</i><b>Livre</b></div>'}return '<article class="team-card"><div class="team-title"><i class="team-color" style="background:'+colors[i]+'"></i>'+names[i]+'</div><div class="pitch">'+html+'</div></article>'}
let drag=null;function startDrag(e,id){if(e.button!==undefined&&e.button!==0)return;let el=e.currentTarget,field=el.closest('.pitch');if(!field)return;drag={id,el,field,x:0,y:0};el.classList.add('dragging');el.setPointerCapture?.(e.pointerId);e.preventDefault();moveDrag(e)}function moveDrag(e){if(!drag)return;let r=drag.field.getBoundingClientRect(),x=Math.max(5,Math.min(95,(e.clientX-r.left)/r.width*100)),y=Math.max(5,Math.min(95,(e.clientY-r.top)/r.height*100));drag.x=x;drag.y=y;drag.el.style.left=x+'%';drag.el.style.top=y+'%';if(e.cancelable)e.preventDefault()}function endDrag(){if(!drag)return;s.tactical[drag.id]={x:drag.x,y:drag.y};drag.el.classList.remove('dragging');drag=null;save()}document.addEventListener('pointermove',moveDrag,{passive:false});document.addEventListener('pointerup',endDrag);function resetTactics(){s.tactical={};save()}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));a.download='minha-pelada-backup.json';a.click();URL.revokeObjectURL(a.href)}
async function restore(e){try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v.players)||!v.players.every(p=>typeof p.name==='string'&&typeof p.id==='string'&&['Linha','Goleiro'].includes(p.pos)&&Number.isFinite(p.skill)&&Number.isFinite(p.gols))||!Number.isInteger(v.n)||v.n<1||v.n>11||![0,1].includes(v.g)||!Number.isInteger(v.t)||v.t<2||v.t>8)throw Error();if(confirm('Substituir os dados atuais pelo backup?')){s={...defaults,...v,teams:[]};save()}}catch{alert('Arquivo de backup inválido')}}
function empty(title,text,button){return '<div class="empty"><strong>'+title+'</strong><span>'+text+'</span>'+(button||'')+'</div>'}
function render(){
  $('brand').textContent=s.name||'Minha Pelada';$('nav').innerHTML=tabs.map(t=>'<button class="'+(t===tab?'active':'')+'" aria-current="'+(t===tab?'page':'false')+'" onclick="setTab(\''+t+'\')">'+t+'</button>').join('');let html='';
  if(tab==='Times'){let c=confirmed(),total=(s.n+s.g)*s.t,used=s.teams.flat(),line=c.filter(p=>p.pos==='Linha').length,keepers=c.filter(p=>p.pos==='Goleiro').length;html='<div class="stats"><div class="stat"><small>Plantel</small><strong>'+s.players.length+'</strong></div><div class="stat"><small>Presentes</small><strong>'+c.length+'</strong></div><div class="stat"><small>Vagas na rodada</small><strong>'+Math.max(0,total-c.length)+'</strong></div></div><div class="layout"><div><section class="panel"><div class="panel-head"><div><h2>Configuração da rodada</h2><p class="hint">Defina o formato antes de sortear os times.</p></div><span class="badge">'+c.length+'/'+total+' presentes</span></div><div class="fields"><label class="field">Jogadores de linha<select onchange="config(\'n\',this.value)">'+opt(1,11,s.n)+'</select></label><label class="field">Goleiros por time<select onchange="config(\'g\',this.value)">'+opt(0,1,s.g)+'</select></label><label class="field">Equipes<select onchange="config(\'t\',this.value)">'+opt(2,8,s.t)+'</select></label></div><p class="hint">Faltam '+Math.max(0,s.n*s.t-line)+' jogadores de linha e '+Math.max(0,s.g*s.t-keepers)+' goleiros para preencher todas as vagas.</p><div class="actions"><button class="btn" onclick="setTab(\'Plantel\')">+ Cadastrar jogadores</button><button class="btn primary" onclick="draw()">✦ Sortear equipes</button></div></section><section class="panel"><div class="panel-head"><div><h2>Campo tático</h2><p class="hint">Arraste os jogadores para ajustar a formação. As posições ficam salvas.</p></div>'+(s.teams.length?'<div class="actions" style="margin-top:0"><button class="btn secondary" onclick="resetTactics()">↺ Repor posições</button><button class="btn secondary" onclick="share()">↗ Partilhar</button></div>':'')+'</div>'+(s.teams.length?'<div class="teams">'+Array.from({length:s.t},(_,i)=>pitch(i)).join('')+'</div><p class="hint"><strong>Suplentes:</strong> '+esc(s.teams.length?c.filter(p=>!used.includes(p.id)).map(p=>p.name).join(', ')||'Nenhum':'Aguardando sorteio')+'</p>':empty('Nenhum sorteio realizado','Confirme os jogadores presentes e gere as equipas da rodada.','<div class="actions" style="justify-content:center"><button class="btn primary" onclick="draw()">Sortear agora</button></div>'))+'</section></div><aside><section class="panel"><h2>Resumo rápido</h2><div class="summary"><div class="summary-line"><span>Formato</span><strong>'+s.n+' × '+s.n+'</strong></div><div class="summary-line"><span>Equipes</span><strong>'+s.t+'</strong></div><div class="summary-line"><span>Goleiros</span><strong>'+s.g+' por equipe</strong></div></div></section><section class="panel"><h2>Próximo passo</h2><p class="hint">Mantenha a lista de presença atualizada para que o sorteio fique equilibrado.</p><button class="btn secondary" onclick="setTab(\'Plantel\')">Ver plantel →</button></section></aside></div>'}
  else if(tab==='Plantel'){html='<section class="panel"><div class="panel-head"><div><h2>Adicionar jogador</h2><p class="hint">Registe os jogadores habituais da sua pelada.</p></div></div><form onsubmit="add(event)"><div class="fields"><label class="field">Nome<input class="input" name="name" required maxlength="60" placeholder="Ex.: João Silva"></label><label class="field">Posição<select name="pos"><option>Linha</option><option>Goleiro</option></select></label><label class="field">Nível técnico<select name="skill">'+opt(1,5,3)+'</select></label></div><div class="actions"><button class="btn primary">Adicionar ao plantel</button></div></form></section><section class="panel"><div class="panel-head"><div><h2>Lista de presença</h2><p class="hint">Marque quem está disponível hoje.</p></div><span class="badge">'+confirmed().length+' presentes</span></div>'+(s.players.length?s.players.map(p=>'<div class="item"><input class="check" aria-label="Confirmar presença de '+esc(p.name)+'" type="checkbox" '+(p.ok?'checked':'')+' onchange="change(\''+p.id+'\',\'ok\',this.checked)"><span><strong>'+esc(p.name)+'</strong><br><small>'+esc(p.pos)+' · nível '+p.skill+'</small></span><button class="btn danger" onclick="del(\''+p.id+'\')">Excluir</button></div>').join(''):empty('O plantel está vazio','Adicione o primeiro jogador acima.'))+'</section>'}
  else if(tab==='Artilharia'){html='<section class="panel"><div class="panel-head"><div><h2>Chuteira de ouro</h2><p class="hint">Atualize os golos após cada partida.</p></div><span class="badge">'+s.players.reduce((a,p)=>a+p.gols,0)+' golos</span></div>'+(s.players.length?[...s.players].sort((a,b)=>b.gols-a.gols).map((p,i)=>'<div class="item"><span><strong>'+String(i+1).padStart(2,'0')+' · '+esc(p.name)+'</strong><br><small>Artilharia da temporada</small></span><div class="stepper"><button onclick="change(\''+p.id+'\',\'gols\','+Math.max(0,p.gols-1)+')" aria-label="Diminuir golos">−</button><strong>'+p.gols+'</strong><button onclick="change(\''+p.id+'\',\'gols\','+(p.gols+1)+')" aria-label="Aumentar golos">+</button></div></div>').join(''):empty('Ainda não há jogadores','Cadastre o plantel para começar a acompanhar os golos.'))+'</section>'}
  else if(tab==='Financeiro'||tab==='Churrasco'){let k=tab==='Financeiro'?'pago':'bbq',done=s.players.filter(p=>p[k]).length;html='<section class="panel"><div class="panel-head"><div><h2>'+tab+'</h2><p class="hint">Controle tudo o que precisa ser confirmado antes do jogo.</p></div><span class="badge">'+done+'/'+s.players.length+' confirmados</span></div>'+(k==='pago'?'<label class="field">Valor por jogador (R$)<input class="input" type="number" min="0" step=".01" value="'+esc(s.fee)+'" onchange="s.fee=Math.max(0,Number(this.value)||0);save()"></label><div class="summary" style="margin-top:17px"><div class="summary-line"><span>Arrecadado</span><strong>R$ '+(done*s.fee).toFixed(2)+'</strong></div><div class="summary-line"><span>Pendente</span><strong>R$ '+((s.players.length-done)*s.fee).toFixed(2)+'</strong></div></div>':'<div class="notice">Confirme quem vai participar do churrasco para calcular as compras.</div>')+(s.players.length?s.players.map(p=>'<div class="item"><span>'+esc(p.name)+'</span><input class="check" aria-label="Confirmar '+esc(p.name)+'" type="checkbox" '+(p[k]?'checked':'')+' onchange="change(\''+p.id+'\',\''+k+'\',this.checked)"></div>').join(''):empty('Ainda não há jogadores','Cadastre o plantel primeiro.'))+'</section>'}
  else {html='<section class="panel"><div class="panel-head"><div><h2>Personalização</h2><p class="hint">Deixe a app com a cara da sua pelada.</p></div></div><label class="field">Nome da pelada<input class="input" value="'+esc(s.name)+'" maxlength="40" onchange="s.name=this.value.trim()||\'Minha Pelada\';save()"></label><h3>Backup local</h3><p class="hint">Os dados ficam neste navegador. Exporte um backup regularmente para evitar perdas ao trocar de dispositivo.</p><div class="actions"><button class="btn secondary" onclick="backup()">↓ Exportar backup</button><label class="btn" style="cursor:pointer">↑ Restaurar backup<input type="file" accept=".json" onchange="restore(event)" hidden></label></div></section>'}
  $('app').innerHTML=html;$('page-title').innerHTML=tab==='Times'?'A sua pelada,<br><span style="color:var(--brand)">mais organizada.</span>':tab+'<br><span style="color:var(--brand)">sem complicação.</span>';
}
render();
</script>
</body>
</html>
