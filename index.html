<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101820"><title>Minha Pelada</title><style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#e9f3ef;font:16px system-ui}main{max-width:960px;margin:auto;padding:20px}header{border-bottom:1px solid #34463e;padding-bottom:16px}h1{color:#70ef9a;margin:0}small{color:#a1b5ac}nav{display:flex;gap:8px;overflow:auto;margin:16px 0}button,input,select{font:inherit;border:1px solid #40564b;border-radius:9px;padding:10px;background:#1e3029;color:white}button{cursor:pointer}button.primary,button.active{background:#70ef9a;color:#10251a;font-weight:700}section,.panel{background:#172820;border:1px solid #30463a;border-radius:15px;padding:16px;margin:12px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{max-width:100%}label{display:grid;gap:5px;flex:1;min-width:90px}input{min-width:0;width:100%}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.pitch{aspect-ratio: .72;background:repeating-linear-gradient(#21613d 0 12.5%,#286d46 12.5% 25%);position:relative;border:2px solid #a8d8ae;border-radius:5px;margin-top:12px}.pitch:before{content:'';position:absolute;top:50%;width:100%;border-top:1px solid #a8d8ae}.pitch:after{content:'';position:absolute;left:35%;top:39%;width:30%;aspect-ratio:1;border:1px solid #a8d8ae;border-radius:50%}.player{position:absolute;transform:translate(-50%,-50%);text-align:center;z-index:1;font-size:11px;width:32%;overflow:hidden}.dot{display:block;margin:auto;border:1px solid white;border-radius:50%;width:25px;height:25px;line-height:24px;color:#111;font-weight:bold}.player b{background:#12291d;padding:2px;border-radius:3px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #30463a}.item span{flex:1}.item input{width:auto}.stats{display:flex;gap:10px}.stats div{flex:1;background:#20372a;padding:12px;border-radius:10px}.stats strong{display:block;color:#70ef9a;font-size:25px}h2{font-size:19px}p{line-height:1.5}.muted{color:#a1b5ac}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #70ef9a}
</style><main><header><h1 id="brand">⚽ Minha Pelada</h1><small>GESTÃO ESPORTIVA • DIA DE JOGO</small></header><nav id="nav"></nav><div id="app"></div></main><script>
const defaults={name:'Minha Pelada',n:5,g:1,t:3,fee:67,players:[],teams:[],history:[]};let s;try{s={...defaults,...JSON.parse(localStorage.getItem('pelada-v1')||'{}')}}catch{ s=structuredClone(defaults)}let tab='Times';const $=id=>document.getElementById(id);const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem('pelada-v1',JSON.stringify(s))}catch{alert('Não foi possível salvar. Exporte um backup.')}render()};const tabs=['Times','Plantel','Artilharia','Financeiro','Churrasco','Configurações'];const colors=['#fff','#94a3b8','#f87171','#60a5fa','#facc15','#c084fc','#fb923c','#2dd4bf'];const names=['Branco','Preto','Vermelho','Azul','Amarelo','Roxo','Laranja','Verde'];const opt=(min,max,v)=>Array.from({length:max-min+1},(_,i)=>'<option '+(i+min===v?'selected':'')+'>'+(i+min)+'</option>').join('');const confirmed=()=>s.players.filter(p=>p.ok);function config(k,v){s[k]=Number(v);s.teams=[];save()}function setTab(t){tab=t;render()}function add(e){e.preventDefault();let f=new FormData(e.target);let name=String(f.get('name')).trim();if(!name)return;s.players.push({id:crypto.randomUUID(),name,pos:f.get('pos'),skill:Number(f.get('skill')),ok:true,gols:0,pago:false,bbq:false});save()}function change(id,k,v){let p=s.players.find(p=>p.id===id);if(p){p[k]=v;if(['ok','pos','skill'].includes(k))s.teams=[];save()}}function del(id){if(confirm('Excluir jogador e seus registros?')){s.players=s.players.filter(p=>p.id!==id);s.teams=[];save()}}function draw(){let a=Array.from({length:s.t},()=>[]);let pool=confirmed();for(let [pos,cap] of [['Goleiro',s.g],['Linha',s.n]]){let group=pool.filter(p=>p.pos===pos).map(p=>({p,r:Math.random()})).sort((a,b)=>b.p.skill-a.p.skill||a.r-b.r).map(x=>x.p);for(let p of group){let choices=a.map((team,i)=>({team,i})).filter(x=>x.team.filter(q=>q.pos===pos).length<cap);if(!choices.length)break;choices.sort((x,y)=>x.team.reduce((z,q)=>z+q.skill,0)-y.team.reduce((z,q)=>z+q.skill,0)||x.team.length-y.team.length);choices[0].team.push(p)}}s.teams=a.map(t=>t.map(p=>p.id));save()}function share(){let text=s.teams.map((t,i)=>'Time '+names[i]+': '+t.map(id=>s.players.find(p=>p.id===id)?.name).join(', ')).join('\n');if(navigator.share)navigator.share({text}).catch(()=>{});else window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener')}function pitch(i){let team=(s.teams[i]||[]).map(id=>s.players.find(p=>p.id===id)).filter(Boolean);let html='';for(let j=0;j<s.n+s.g;j++){let keeper=s.g&&j===0;let k=j-s.g;let cols=Math.min(3,s.n);let rows=Math.ceil(s.n/cols);let x=keeper?50:(k%cols+.5)*100/cols;let y=keeper?89:rows===1?45:72-Math.floor(k/cols)*60/(rows-1);let p=keeper?team.find(p=>p.pos==='Goleiro'):team.filter(p=>p.pos==='Linha')[k];html+='<div class="player" style="left:'+x+'%;top:'+y+'%"><i class="dot" style="background:'+colors[i]+'">'+(keeper?'G':k+1)+'</i><b>'+esc(p?.name||'Livre')+'</b></div>'}return '<div><strong>● '+names[i]+'</strong><div class="pitch">'+html+'</div></div>'}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));a.download='minha-pelada-backup.json';a.click();URL.revokeObjectURL(a.href)}async function restore(e){try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v.players)||!v.players.every(p=>typeof p.name==='string'&&typeof p.id==='string'&&/^[\w-]+$/.test(p.id)&&['Linha','Goleiro'].includes(p.pos)&&Number.isFinite(p.skill)&&Number.isFinite(p.gols))||!Number.isInteger(v.n)||v.n<1||v.n>11||![0,1].includes(v.g)||!Number.isInteger(v.t)||v.t<2||v.t>8)throw Error();if(confirm('Substituir os dados atuais pelo backup?')){s={...defaults,...v,teams:[]};save()}}catch{alert('Arquivo de backup inválido')}}function render(){$('brand').textContent='⚽ '+s.name;$('nav').innerHTML=tabs.map(t=>'<button class="'+(t===tab?'active':'')+'" onclick="setTab(\''+t+'\')">'+t+'</button>').join('');let html='';if(tab==='Times'){let c=confirmed(),total=(s.n+s.g)*s.t;let used=s.teams.flat();html='<div class="stats"><div><small>Plantel</small><strong>'+s.players.length+'</strong></div><div><small>Presentes</small><strong>'+c.length+'</strong></div><div><small>Vagas</small><strong>'+total+'</strong></div></div><section><h2>Configuração da rodada</h2><div class="fields"><label>Jogadores de linha<select onchange="config(\'n\',this.value)">'+opt(1,11,s.n)+'</select></label><label>Goleiros por time<select onchange="config(\'g\',this.value)">'+opt(0,1,s.g)+'</select></label><label>Equipes<select onchange="config(\'t\',this.value)">'+opt(2,8,s.t)+'</select></label></div><p>'+ (s.n+s.g)+' × '+(s.n+s.g)+' • '+c.length+'/'+total+' confirmados</p><p class="muted">Faltam '+Math.max(0,s.n*s.t-c.filter(p=>p.pos==='Linha').length)+' de linha e '+Math.max(0,s.g*s.t-c.filter(p=>p.pos==='Goleiro').length)+' goleiros.</p><div class="row"><button onclick="setTab(\'Plantel\')">Cadastrar jogadores</button><button class="primary" onclick="draw()">Sortear equipes</button></div></section><section><h2>Campo tático</h2><div class="teams">'+Array.from({length:s.t},(_,i)=>pitch(i)).join('')+'</div><p>Suplentes: '+(s.teams.length?esc(c.filter(p=>!used.includes(p.id)).map(p=>p.name).join(', ')||'Nenhum'):'Aguardando sorteio')+'</p>'+(s.teams.length?'<button onclick="share()">Compartilhar escalação</button>':'')+'</section>'}else if(tab==='Plantel'){html='<section><h2>Cadastrar jogador</h2><form onsubmit="add(event)"><div class="fields"><label>Nome<input name="name" required maxlength="60"></label><label>Posição<select name="pos"><option>Linha</option><option>Goleiro</option></select></label><label>Nível técnico<select name="skill">'+opt(1,5,3)+'</select></label></div><p><button class="primary">Adicionar jogador</button></p></form></section><section><h2>Lista de presença</h2>'+s.players.map(p=>'<div class="item"><input aria-label="Confirmar presença" type="checkbox" '+(p.ok?'checked':'')+' onchange="change(\''+p.id+'\',\'ok\',this.checked)"><span>'+esc(p.name)+'<br><small>'+esc(p.pos)+' • nível '+p.skill+'</small></span><button onclick="del(\''+p.id+'\')">Excluir</button></div>').join('')+'</section>'}else if(tab==='Artilharia'){html='<section><h2>🏆 Chuteira de ouro</h2>'+[...s.players].sort((a,b)=>b.gols-a.gols).map((p,i)=>'<div class="item"><span>'+(i+1)+'º '+esc(p.name)+'</span><button onclick="change(\''+p.id+'\',\'gols\','+Math.max(0,p.gols-1)+')">−</button><strong>'+p.gols+'</strong><button onclick="change(\''+p.id+'\',\'gols\','+(p.gols+1)+')">+</button></div>').join('')+'</section>'}else if(tab==='Financeiro'||tab==='Churrasco'){let k=tab==='Financeiro'?'pago':'bbq';html='<section><h2>'+tab+'</h2>'+(k==='pago'?'<label>Mensalidade R$<input type="number" min="0" step=".01" value="'+esc(s.fee)+'" onchange="s.fee=Math.max(0,Number(this.value)||0);save()"></label><p>Arrecadado: R$ '+(s.players.filter(p=>p.pago).length*s.fee).toFixed(2)+' | Pendente: R$ '+(s.players.filter(p=>!p.pago).length*s.fee).toFixed(2)+'</p>':'<p>'+s.players.filter(p=>p.bbq).length+' confirmados</p>')+s.players.map(p=>'<div class="item"><span>'+esc(p.name)+'</span><input aria-label="Confirmar" type="checkbox" '+(p[k]?'checked':'')+' onchange="change(\''+p.id+'\',\''+k+'\',this.checked)"></div>').join('')+'</section>'}else{html='<section><h2>Personalização</h2><label>Nome da pelada<input value="'+esc(s.name)+'" onchange="s.name=this.value.trim()||\'Minha Pelada\';save()"></label><h2>Backup local</h2><p>Seus dados ficam neste navegador. Exporte regularmente para evitar perdas.</p><button onclick="backup()">Exportar backup</button><p><label>Restaurar backup<input type="file" accept=".json" onchange="restore(event)"></label></p></section>'}$('app').innerHTML=html}render();
</script></html>
